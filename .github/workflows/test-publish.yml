name: Test Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Test version suffix (e.g., dev1, alpha1, rc1)'
        required: false
        default: 'dev1'
        type: string
  pull_request:
    branches: [ main ]
    paths:
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/publish.yml'
      - '.github/workflows/test-publish.yml'

jobs:
  test-build:
    name: Test build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pltr/
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: |
          # Run all tests including integration tests (import issues fixed)
          uv run pytest tests/ --cov=pltr --cov-report=xml --cov-report=term

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run type checking
        run: |
          uv run mypy src/pltr

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Install tomli-w for version updating
        run: uv add tomli-w --dev

      - name: Create test version
        id: test_version
        run: |
          BASE_VERSION="${{ steps.current_version.outputs.VERSION }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TEST_SUFFIX="${{ github.event.inputs.test_version }}"
          else
            # For PR builds, use PR number and run number
            TEST_SUFFIX="dev${{ github.run_number }}"
          fi
          TEST_VERSION="${BASE_VERSION}.${TEST_SUFFIX}"
          echo "TEST_VERSION=$TEST_VERSION" >> $GITHUB_OUTPUT
          echo "Building test version: $TEST_VERSION"

      - name: Update version for test build
        run: |
          # Create a temporary pyproject.toml with test version
          uv run python -c "
          import tomllib, tomli_w

          with open('pyproject.toml', 'rb') as f:
              config = tomllib.load(f)

          config['project']['version'] = '${{ steps.test_version.outputs.TEST_VERSION }}'

          with open('pyproject.toml', 'wb') as f:
              tomli_w.dump(config, f)
          "

      - name: Build package
        run: |
          uv build --no-sources

      - name: Verify package contents
        run: |
          echo "Built distributions:"
          ls -la dist/
          echo ""
          echo "Checking wheel contents:"
          uv run python -m zipfile -l dist/*.whl

      # TestPyPI's trusted-publishing token exchange sometimes times out (the
      # action allows it 5 seconds), so a failed first attempt is retried once.
      # skip-existing makes the retry safe if the first attempt uploaded files.
      - name: Publish to TestPyPI
        id: publish
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          skip-existing: true

      - name: Wait before retrying the TestPyPI publish
        if: steps.publish.outcome == 'failure'
        run: sleep 60

      - name: Publish to TestPyPI (retry)
        if: steps.publish.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          skip-existing: true

      - name: Test installation from TestPyPI
        env:
          TEST_VERSION: ${{ steps.test_version.outputs.TEST_VERSION }}
        run: |
          # Install into a fresh virtualenv outside the checkout, so the smoke
          # test runs the published package, not the project's editable install.
          python -m venv "$RUNNER_TEMP/testpypi-venv"
          VENV_BIN="$RUNNER_TEMP/testpypi-venv/bin"
          cd "$RUNNER_TEMP"

          # TestPyPI's index can take minutes to list a fresh upload, so retry.
          attempts=10
          for attempt in $(seq 1 "$attempts"); do
            if "$VENV_BIN/pip" install --no-cache-dir \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "pltr-cli==$TEST_VERSION"; then
              break
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "::error::pltr-cli==$TEST_VERSION was not installable from TestPyPI after $attempts attempts"
              exit 1
            fi
            echo "pltr-cli==$TEST_VERSION is not installable yet (attempt $attempt/$attempts); retrying in 30s"
            sleep 30
          done

          # Test basic import and CLI functionality of the installed package
          "$VENV_BIN/python" -c "import pltr; print(f'Package import successful: {pltr.__file__}')"
          "$VENV_BIN/pltr" --help

      - name: Report test results
        if: always()
        run: |
          echo "## Test Publish Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Version**: ${{ steps.test_version.outputs.TEST_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **TestPyPI URL**: https://test.pypi.org/project/pltr-cli/${{ steps.test_version.outputs.TEST_VERSION }}/" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "- **Status**: ✅ Successfully published and tested" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ❌ Test failed" >> $GITHUB_STEP_SUMMARY
          fi
